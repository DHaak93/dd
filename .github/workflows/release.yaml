name: Release

# When the add-on version in dd/config.yaml changes on master:
#   1. tag the commit v<version> (so a version always maps to the same code)
#   2. build the add-on image for each arch from that tag and push it to
#      ghcr.io/<owner>/<arch>-addon-dd:<version>
#
# Home Assistant pulls these images once config.yaml has
#   image: "ghcr.io/dhaak93/{arch}-addon-dd"
# instead of compiling the add-on on the HA machine.
#
# Re-running for a version whose tag already exists rebuilds and re-pushes
# the image from that tag (useful if a build failed half-way).

on:
  push:
    branches:
      - master
    paths:
      - dd/config.yaml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' dd/config.yaml)
          if [ -z "$version" ]; then echo "No version in dd/config.yaml"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $version"

      - name: Create tag v${{ steps.version.outputs.version }}
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; building from it."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-addon-dd" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dd
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.tag.outputs.version }}
            DD_REPO=https://github.com/${{ github.repository }}.git
            DD_REF=v${{ needs.tag.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.tag.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.tag.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
