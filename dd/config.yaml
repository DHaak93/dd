name: SmartDoor MQTT Bridge (DHaak93)
slug: dd
version: "0.3.5-dh9"
# Prebuilt by the Release workflow; wait for it to finish before updating.
image: "ghcr.io/dhaak93/{arch}-addon-dd"
description: SmartDoor garage door integration with MQTT and position control support
url: "https://github.com/DHaak93/dd"
init: false
services:
  - mqtt:need

# armhf, armv7 and i386 are deprecated by Home Assistant.
arch:
  - aarch64
  - amd64

# Home Assistant's config folder, still mounted at /config so the existing
# /config/dd-credentials.json keeps working (the legacy "config" map type is
# deprecated; homeassistant_config would otherwise mount at /homeassistant).
map:
  - type: homeassistant_config
    read_only: false
    path: /config

options:
  code: ""
  password: ""
  host: ""
  mqtt_prefix: dd-door
  poll_interval: 60
  debug: false

schema:
  code: str
  password: password
  host: str
  mqtt_prefix: str
  poll_interval: int?
  debug: bool
